include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/reuse-lint.yml
      - /gitlab-templates/blocks/workflow.yml

stages:
  - validate
  - build

rust-latest:
  stage: build
  tags:
    - VM
    - amd64
  image: storage.kde.org/vm-images/kde-linux-builder
  # before_script:
  #   - apt-get update
  #   - apt-get install -y clang llvm-dev libclang-dev pkg-config libbtrfsutil-dev btrfs-progs
  script:
    - cargo build
    - make test
